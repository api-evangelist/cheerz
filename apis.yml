aid: cheerz
name: Cheerz
description: >-
  Cheerz is a French direct-to-consumer photo-printing brand. Customers pick photos from their
  phone camera roll or a connected cloud gallery in the Cheerz iOS/Android app or on cheerz.com,
  and Cheerz prints and ships the result as photo prints, fridge magnets, photo books and albums,
  wall canvases, framed prints and posters, calendars including advent calendars, puzzles,
  greeting and invitation cards, and the branded Cheerz Box and Memory Box gift formats. Founded
  in Paris in 2012 under the legal entity Printklub, backed by Serena Capital and Iron Capital,
  and acquired by the German photo-finishing group CEWE Stiftung & Co. KGaA in February 2018 for
  roughly EUR 45 million; it continues to operate as CEWE's Paris site. Cheerz publishes no public
  API, developer portal, SDK or machine-readable contract of any kind — it is an end-user retail
  product, and partnership, bulk-order and affiliate enquiries are handled by a human contact
  channel rather than a developer programme.
