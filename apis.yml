- type: IntegrationModel
  data:
  - name: No Public Developer API
    description: >-
      Cheerz publishes no public API, developer portal, API reference, SDK or machine-readable
      contract. Probed 2026-08-17: /openapi.json, /openapi.yaml, /swagger.json, /docs, /api,
      /graphql, /developers and /developer all 404 on www.cheerz.com; no api., developer.,
      developers., docs., partners., status., pro. or mcp. subdomain of cheerz.com resolves in
      DNS; all 14 /.well-known/* probes across www.cheerz.com and support.cheerz.com returned
      404. /api-docs returns HTTP 200 but is the Google-OAuth login for the internal "Cheerz
      Admin" back office, not an API reference. robots.txt Disallows /*/api/*, the private JSON
      backend the Cheerz SPA and mobile apps call — undocumented, not offered to third parties,
      and deliberately NOT recorded here as an API surface. This entry documents the ABSENCE of
      a published contract; it does not carry the canonical Authentication or WellKnown types,
      which would credit Cheerz with surfaces it does not publish.
- type: Products
  data:
  - name: Photo Prints
    description: Prints in multiple formats with optional coloured borders and finish choices.
  - name: Magnets
    description: Photo fridge magnets, including writable variants.
  - name: Photo Books and Albums
    description: Hardcover, softcover, mini and DIY/scrapbook albums.
  - name: Wall Decor
    description: Canvases (classic and retro), framed prints, posters and pele-mele arrangements.
  - name: Calendars
    description: A3/A4 portrait and landscape, 30x45 and advent calendars.
  - name: Cards
    description: Greeting and invitation cards, including a photo-and-video card.
  - name: Puzzles
    description: Photo puzzles in several sizes.
  - name: Cheerz Box and Memory Box
    description: Branded curated photo gift boxes.
